id: PHL-D-003
name: MIFARE UID anomaly on PACS
techniques: [PHL-T-003]
data_sources: [PHL-DS-01]
platform: sigma
logic: |
  description: |
    Detects behaviour consistent with MIFARE Classic cloning (PHL-T-003): the same
    card UID authenticating at two readers that are physically incompatible within a
    short window (a card cannot be in two places at once), or a burst of failed reads
    of one UID immediately followed by a successful auth with that UID (key recovery
    in progress, then an emulated clone). Targets physical access control system
    (PACS) event logs normalised to JSON lines. The Wazuh form approximates reader
    incompatibility as two different sites within five minutes.
  references:
    - https://github.com/phlipped-fw/phlipped/blob/main/data/techniques/PHL-T-003.md
  logsource:
    product: pacs
    category: access_event
  detection:
    same_uid_two_sites:
      pacs_event: 'card_read'
      result: 'granted'
      uid_granted_at_other_site_within: 5m
    recovery_then_auth:
      pacs_event: 'card_read'
      result: 'granted'
      uid_had_failed_reads_within: 5m   # 5 or more denied reads inside 60s
    condition: same_uid_two_sites or recovery_then_auth
  fields:
    - uid
    - reader_id
    - site
    - result
  level: high
  tags:
    - attack.credential_access
    - attack.t1556
    - attack.defense_evasion
    - attack.t1078
false_positives:
  - Legitimate anti-passback exceptions (escort, maintenance override)
  - Clock skew between readers wider than the correlation window
status: experimental
version: 0.1.0
added: 0.1.0
modified: 2026-11-17
