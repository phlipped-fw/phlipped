id: PHL-D-002
name: HID injection typing burst
techniques: [PHL-T-002]
data_sources: [PHL-DS-07, PHL-DS-08]
platform: sigma
logic: |
  description: |
    Detects a shell or script host started from explorer (the Run dialog a keystroke-injection
    payload drives) whose command line carries payload traits: hidden window, encoded or
    no-profile powershell, or a download cradle. Explorer as parent alone is normal desktop
    use, so the command-line condition is what separates BadUSB / RubberDucky / O.MG cable
    injection from a user opening a terminal.
  references:
    - https://github.com/phlipped-fw/phlipped/blob/main/data/techniques/PHL-T-002.md
  logsource:
    product: windows
    category: process_creation
  detection:
    proc:
      Image|endswith:
        - '\cmd.exe'
        - '\powershell.exe'
        - '\wscript.exe'
        - '\mshta.exe'
      ParentImage|endswith:
        - '\explorer.exe'
    payload:
      CommandLine|contains:
        - ' -w hidden'
        - ' -windowstyle hidden'
        - ' -enc '
        - ' -encodedcommand '
        - ' -nop'
        - 'downloadstring'
        - 'invoke-webrequest'
        - 'iex '
        - 'certutil -urlcache'
        - 'bitsadmin /transfer'
    condition: proc and payload
  fields:
    - User
    - Image
    - ParentImage
    - CommandLine
  level: high
  tags:
    - attack.initial_access
    - attack.t1200
    - attack.execution
    - attack.t1059.001
false_positives:
  - Admins launching hidden or encoded powershell from the Run dialog (allow-list by user)
  - Misses payloads that avoid these traits; typing-rate telemetry is the planned complement
status: experimental
version: 0.1.0
added: 0.1.0
modified: 2026-11-17
