site_name: PHLIPPED
site_url: https://phlipped.n0t.space
docs_dir: ../docs
site_dir: ../_site
strict: true

theme:
  name: material

plugins:
  - search
  - gen-files:
      scripts: [gen/gen_pages.py]
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index

validation:
  nav:
    omitted_files: warn
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - About: about.md
  - Worked thread: worked-thread.md
  - Catalog: techniques/
  - Detections: detections/
  - Mitigations: mitigations/
  - Matrix: matrix.md
  - Mappings: mappings.md
  - Data model: data-model.md
  - Decisions: decisions.md
  - Building: building.md
