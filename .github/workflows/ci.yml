name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r requirements-dev.txt
      - name: build gate
        run: python -m build.build
      - name: tests
        run: pytest build/tests tools/assess site/tests -q
      - name: site build
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict -f site/mkdocs.yml
