name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r requirements-dev.txt
      - name: catalog schema validation
        run: python catalog/build.py
      - name: assess unit tests
        run: pytest tools/assess -q
      - name: build site
        run: python site/build.py
      - name: link check
        run: python site/linkcheck.py
